<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your order - CIRA</title><link rel="stylesheet" href="./style.css">
<style>
.prog{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9aa39d}
.prog span{flex:1;border-top:3px solid var(--line);padding-top:6px}.prog span.done,.prog span.on{color:var(--green);border-color:var(--green)}
.timer{background:var(--red);color:#fff;text-align:center;padding:9px 12px;font-size:14px;font-weight:700}.timer b{font-variant-numeric:tabular-nums;font-size:17px;margin-left:4px}
.of{max-width:1100px;margin:0 auto;padding:6px 16px 0;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.of{grid-template-columns:1fr 1fr;gap:48px;padding-top:18px}}
.eyebrow{font-size:13px;font-weight:700;color:var(--green);margin:0 0 6px}
.of h1{font-size:30px;line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}@media(min-width:900px){.of h1{font-size:42px}}
.copy p{margin:0 0 10px;font-size:16px}
.gal .main{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg)}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.thumbs img{aspect-ratio:1/1;object-fit:cover;cursor:pointer;opacity:.7;border:1.5px solid transparent}.thumbs img.on{opacity:1;border-color:var(--green)}
.pr{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;flex-wrap:wrap}.pr .now{font-size:30px;font-weight:700}.pr s{font-size:18px}
.pt{list-style:none;padding:0;margin:14px 0;border-top:1px solid var(--line)}.pt li{padding:9px 0 9px 24px;border-bottom:1px solid var(--line);position:relative;font-size:14px}
.pt li:before{content:"";position:absolute;left:2px;top:14px;width:10px;height:6px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
.btn.yes{font-size:18px;padding:19px 12px;line-height:1.2}.btn.yes small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:3px}
.no{display:block;width:100%;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:14px;cursor:pointer}
.urg{font-size:13px;color:var(--red);font-weight:700;margin:10px 0 0}
.g{display:flex;gap:12px;align-items:flex-start;background:var(--bg);padding:12px;margin-top:8px;font-size:13px}.g b{display:block;font-size:14px}
.seal{flex:none;width:44px;height:44px;border:1.5px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--green);line-height:1;text-align:center}
.ph-banner{background:#fff3cd;border:2px dashed #b08a2e;color:#6b5418;padding:10px;font-weight:700;margin-bottom:12px}
.mcta{display:block}@media(min-width:900px){.mcta{display:none}}.dcta{display:none}@media(min-width:900px){.dcta{display:block}}
.dead{max-width:560px;margin:40px auto;padding:0 16px;text-align:center}.gone{display:none!important}
</style></head><body data-noann="1">
<div class="timer gone" id="timer">Offer reserved for <b id="clock">5:00</b></div>
<div class="prog"><span class="done">Checkout</span><span class="on" id="pstep">Your offer</span><span>Confirmation</span></div>
<main id="live">
<div class="of">
  <div>
    <div id="phb"></div><p class="eyebrow" id="eyebrow"></p><h1 id="h"></h1>
    <div class="mcta" id="mprice"></div>
    <div class="gal" id="gal"></div>
  </div>
  <div>
    <div class="copy dcta" id="copyD"></div>
    <div class="copy mcta" id="copyM"></div>
    <div style="font-weight:700;font-size:15px;margin-top:6px" id="otitle"></div>
    <div class="pr" id="oprice"></div>
    <ul class="pt" id="points"></ul>
    <button class="btn yes" id="yes">YES, ADD TO MY ORDER - <span id="p1"></span><small>One click. Charged to the card you just used.</small></button>
    <button class="no" id="no">No thanks, I will skip this offer</button>
    <div class="err" id="err"></div>
    <p class="urg" id="urg"></p>
    <div class="g"><div class="seal">30<br>DAY</div><div><b>30-day money-back guarantee</b>Ships in the same box as your cream. One-time purchase, no subscription. <a href="./refund-policy">Refund policy</a></div></div>
  </div>
</div></main>
<div class="dead gone" id="dead"><h1 style="font-size:28px">This offer has expired</h1><p class="muted">Your original order is confirmed and on its way.</p><button class="btn" id="cont">Continue</button></div>
<script src="./mock-api.js"></script><script src="./common.js"></script>
<script>(async () => {
  const cfg = await loadConfig(); const route = location.pathname.split('/').pop().replace('.html',''); const key = route === 'upsell' ? 'upsell1' : route; const o = cfg.offers[key];
  const t = new URLSearchParams(location.search).get('t') || sessionStorage.getItem('cira_token');
  const nav = n => location.href = './' + n + '?t=' + t;
  const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t, offer: key, ...b }) }).then(r => r.json());
  await post('/api/checkout/confirmed', {});
  const st = await post('/api/offer/state', {});
  if (st.error) return nav('thank-you');
  let next = st.next || o.no;
  const kill = () => { $('#live').classList.add('gone'); document.querySelector('.prog').classList.add('gone'); $('#dead').classList.remove('gone'); $('#timer').textContent = 'Offer expired'; $('#timer').classList.remove('gone'); };
  $('#cont').onclick = () => nav(next);
  if (st.status === 'expired') return kill();
  if (st.status !== 'open') return nav(st.next);
  if (o.step === 3) $('#pstep').textContent = 'One more thing';
  if (o.placeholder) $('#phb').innerHTML = '<div class="ph-banner">PLACEHOLDER PAGE - Upsell 2 content TBD. Not for launch.</div>';
  $('#eyebrow').textContent = o.eyebrow; $('#h').textContent = o.headline;
  const copy = o.copy.map(c => `<p>${c}</p>`).join(''); $('#copyD').innerHTML = copy; $('#copyM').innerHTML = copy;
  $('#otitle').textContent = o.title; $('#p1').textContent = money(o.price);
  const pr = `<span class="now">${money(o.price)}</span>${o.compareAt ? `<s>${money(o.compareAt)}</s><span class="save">SAVE ${money(o.compareAt - o.price)}</span>` : ''}`;
  $('#oprice').innerHTML = pr;
  $('#points').innerHTML = o.points.map(p => `<li>${p}</li>`).join(''); if (!o.points.length) $('#points').classList.add('gone');
  $('#urg').textContent = o.urgency;
  const ph = '<div class="ph">PLACEHOLDER IMAGE<br>' + (o.image ? 'add ' + o.image.replace('/soap-img/', '/workspace/cira-soap/') : 'Upsell 2 image TBD') + '</div>';
  if (o.gallery && o.gallery.length) {
    $('#gal').innerHTML = `<img class="main" id="gmain" src="${o.gallery[0]}" alt="${o.title}"><div class="thumbs">${o.gallery.map((g, i) => `<img src="${g}" class="${i ? '' : 'on'}" alt="">`).join('')}</div>`;
    $('#gmain').onerror = () => $('#gal').innerHTML = ph;
    document.querySelectorAll('.thumbs img').forEach(im => { im.onerror = () => im.remove(); im.onclick = () => { $('#gmain').src = im.src; document.querySelectorAll('.thumbs img').forEach(x => x.classList.toggle('on', x === im)); }; });
  } else $('#gal').innerHTML = ph;
  if (o.timer) {
    $('#timer').classList.remove('gone'); const skew = st.now - Date.now();
    const tick = () => { const ms = st.expiresAt - (Date.now() + skew); if (ms <= 0) { kill(); return clearInterval(iv); }
      const s = Math.ceil(ms / 1000); $('#clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const iv = setInterval(tick, 250); tick();
  }
  const go = async accept => { $('#yes').disabled = $('#no').disabled = true; $('#err').textContent = '';
    const r = await post('/api/offer', { accept });
    if (r.status === 'expired') { next = r.next; return kill(); }
    if (r.error) { $('#err').textContent = r.error; $('#yes').disabled = $('#no').disabled = false; return; }
    nav(r.next); };
  $('#yes').onclick = () => go(true); $('#no').onclick = () => go(false);
})();</script></body></html>
